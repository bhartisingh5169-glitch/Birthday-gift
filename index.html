
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday 🎂</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 20px;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #1a0633, #631b72, #e84393);
      color: white;
    }

    #confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 480px;
      padding: 38px 24px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 28px;
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 15px 50px rgba(0,0,0,.25);
      animation: appear 1s ease;
    }

    .tag {
      display: inline-block;
      padding: 7px 15px;
      margin-bottom: 18px;
      border-radius: 30px;
      background: rgba(255,255,255,.17);
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(2.3rem, 9vw, 3.6rem);
      line-height: 1.15;
      font-weight: 900;
      background: linear-gradient(90deg, #fff, #ffda79, #ff9ff3);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 12px rgba(255,180,220,.2));
    }

    .name {
      margin-top: 12px;
      font-size: clamp(1.7rem, 7vw, 2.5rem);
      font-weight: 800;
      color: #ffda79;
      overflow-wrap: anywhere;
    }

    .cake {
      font-size: 90px;
      margin: 20px 0;
      display: inline-block;
      animation: bounce 2s infinite ease-in-out;
      filter: drop-shadow(0 8px 15px rgba(0,0,0,.2));
    }

    .message {
      font-size: 16px;
      line-height: 1.8;
      color: #fff4fc;
      margin: 0 auto 22px;
      max-width: 360px;
    }

    .wish {
      font-size: 23px;
      margin-bottom: 22px;
      animation: glow 2s infinite alternate;
    }

    button {
      border: none;
      border-radius: 50px;
      padding: 15px 26px;
      width: 100%;
      max-width: 290px;
      background: linear-gradient(90deg, #ffda79, #ff9ff3);
      color: #42104b;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 22px rgba(255,159,243,.25);
      transition: transform .2s, box-shadow .2s;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 28px rgba(255,159,243,.45);
    }

    button:active {
      transform: scale(.97);
    }

    .footer {
      margin-top: 23px;
      font-size: 12px;
      letter-spacing: 1px;
      color: #f9d8f5;
    }

    .balloon {
      position: fixed;
      bottom: -150px;
      font-size: 50px;
      z-index: 1;
      opacity: .75;
      animation: floatUp linear infinite;
      pointer-events: none;
    }

    .b1 { left: 5%; animation-duration: 12s; }
    .b2 { left: 23%; animation-duration: 15s; animation-delay: 3s; }
    .b3 { right: 20%; animation-duration: 13s; animation-delay: 1s; }
    .b4 { right: 5%; animation-duration: 16s; animation-delay: 4s; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(25px) scale(.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px #ff9ff3; }
      to { text-shadow: 0 0 20px #ffda79, 0 0 30px #ff9ff3; }
    }

    @keyframes floatUp {
      from { transform: translateY(0) rotate(0); }
      to { transform: translateY(-125vh) rotate(25deg); }
    }

    @media (max-width: 380px) {
      .card { padding: 30px 17px; }
      .cake { font-size: 72px; }
      .message { font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <canvas id="confetti"></canvas>

  <div class="balloon b1">🎈</div>
  <div class="balloon b2">🎈</div>
  <div class="balloon b3">🎈</div>
  <div class="balloon b4">🎈</div>

  <main class="card">
    <div class="tag">✨ A Special Day ✨</div>

    <h1>Happy Birthday!</h1>

    <!-- Change the name here -->
    <div class="name">Dear Aaru 💖</div>

    <div class="cake">🎂</div>

    <div class="wish">🎉 Make a Wish! 🎉</div>

    <p class="message">
      May your special day be filled with endless smiles,
      beautiful memories, lots of love, and all the happiness
      your heart can hold. May every dream of yours come true! 💕
    </p>

    <button id="celebrateBtn">
      🎊 Celebrate Your Day!
    </button>

    <div class="footer">MADE WITH ❤️ JUST FOR YOU</div>
  </main>

  <script>
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    const colors = [
      "#ffda79", "#ff6bcb", "#ffffff",
      "#7bed9f", "#70a1ff", "#ff4757",
      "#eccc68", "#a29bfe"
    ];

    let pieces = [];
    let animationId = null;

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function burst(count = 180) {
      const mobile = window.innerWidth < 600;
      const total = mobile ? Math.min(count, 100) : count;

      for (let i = 0; i < total; i++) {
        pieces.push({
          x: Math.random() * window.innerWidth,
          y: -20 - Math.random() * window.innerHeight * 0.4,
          size: Math.random() * 7 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          speedX: (Math.random() - 0.5) * 5,
          speedY: Math.random() * 3 + 2,
          rotation: Math.random() * 360,
          spin: (Math.random() - 0.5) * 12,
          shape: Math.random() > 0.5 ? "rect" : "circle"
        });
      }

      if (!animationId) animate();
    }

    function animate() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      pieces.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;
        p.rotation += p.spin;
        p.speedY += 0.025;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation * Math.PI / 180);
        ctx.fillStyle = p.color;

        if (p.shape === "circle") {
          ctx.beginPath();
          ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect(-p.size / 2, -p.size / 2,
                       p.size, p.size * 0.65);
        }

        ctx.restore();
      });

      pieces = pieces.filter(p =>
        p.y < window.innerHeight + 30 &&
        p.x > -50 && p.x < window.innerWidth + 50
      );

      if (pieces.length > 0) {
        animationId = requestAnimationFrame(animate);
      } else {
        cancelAnimationFrame(animationId);
        animationId = null;
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      }
    }

    document.getElementById("celebrateBtn").addEventListener("click", () => {
      burst(220);

      const btn = document.getElementById("celebrateBtn");
      btn.textContent = "🎉 Best Day Ever! 💖";

      setTimeout(() => {
        btn.textContent = "🎊 Celebrate Your Day!";
      }, 2200);
    });

    // Birthday surprise when the page opens
    window.addEventListener("load", () => {
      setTimeout(() => burst(160), 400);
    });
  </script>
</body>
</html>
